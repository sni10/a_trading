[project]
name = "a-trading"
version = "0.1.0"
description = "Algorithmic trading system prototype for crypto exchanges"
license = "MIT"
authors = [
    { name = "Dmitry Strelets", email = "sni10@users.noreply.github.com" },
]
requires-python = ">=3.12,<3.15"

dependencies = [
    "ccxt>=4.5.22",
    "pandas>=2.3.3",
    "ta-lib>=0.6.8",
    "numpy>=2.3.5",
    "termcolor>=3.2.0",
    "pytz>=2025.2",
    "requests>=2.32.5",
    "pywin32>=311; sys_platform == 'win32'",
    "cryptography>=46.0.3",
    "python-dotenv>=1.2.1",
    "SQLAlchemy>=2.0.36",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.15.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.1"
pytest-asyncio = ">=1.3.0"
pytest-cov = ">=6.0.0"
ruff = ">=0.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".venv", "venv", "__pycache__", ".git", ".pytest_cache", "bad_example"]
markers = [
    "unit: Unit tests without I/O",
    "integration: Integration tests with external dependencies",
    "slow: Tests that take significant time",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py312"
exclude = ["__pycache__", "bad_example"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length (handled by ruff format)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]
