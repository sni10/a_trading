services:

    postgres-atr:
        image: postgres:16
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-atrading}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
            interval: 10s
            timeout: 5s
            retries: 3

    redis-atr:
        image: redis:7.0.7
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"

    app:
        build: .
        env_file: .env
        environment:
            POSTGRES_HOST: postgres-atr
            POSTGRES_PORT: 5432
            POSTGRES_DB: ${POSTGRES_DB:-atrading}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            DB_SCHEMA: ${DB_SCHEMA:-main}
            DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-atr:5432/${POSTGRES_DB:-atrading}
        depends_on:
            postgres-atr:
                condition: service_healthy
        volumes:
            - .:/app

volumes:
    postgres_data:
    redis_data:
